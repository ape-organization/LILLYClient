server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (JS/CSS/JSON/SVG).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Hashed build output: safe to cache forever.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Assets are not hashed: cache, but revalidate after a week.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html must always be revalidated so new deploys are picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
