<div class="app-shell">

  <!-- HEADER -->

<app-header></app-header>

  <!-- PAGE CONTENT -->

  <main class="app-content">


<router-outlet></router-outlet>

<!-- WHATSAPP -->

  /> -->

  xmlns="http://www.w3.org/2000/svg"

</div>


  </main>

  <!-- FOOTER -->

<app-footer></app-footer>

  <!-- MOBILE BOTTOM NAVIGATION -->

@if (showBottomNav()) {
<nav
class="mobile-bottom-nav"
(click)="$event.stopPropagation()"
>

  <!-- HOME -->
  <a
    routerLink="/"
    class="bottom-nav-item"
    routerLinkActive="bottom-active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <mat-icon>home</mat-icon>

    <span>
      {{ 'HEADER.HOME' | translate }}
    </span>
  </a>

<!-- ALL PRODUCTS -->
<button
  type="button"
  class="bottom-nav-item"
  [class.bottom-active]="isProductsPage()"
  (click)="selectAllProducts()"
>
  <mat-icon>inventory_2</mat-icon>

  <span>
    {{ 'HEADER.PRODUCTS' | translate }}
  </span>
</button>

<!-- OFFERS -->
<button
  type="button"
  class="bottom-nav-item bottom-offers"
  [class.bottom-active]="isOffersPage()"
  (click)="selectOffers()"
>
  <span class="bottom-offer-icon">

    <mat-icon>
      local_offer
    </mat-icon>

    <span class="bottom-sale-dot">
      !
    </span>

  </span>

  <span>
    {{ 'HEADER.OFFERS' | translate }}
  </span>
</button>
</nav>

}

</div>
