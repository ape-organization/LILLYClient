
<div class="product-filters">

  <div class="mobile-filter-header">

    <div class="mobile-filter-title">

      <mat-icon>
        filter_alt
      </mat-icon>

      <h2>
        {{ 'COMMON.FILTER' | translate }}
      </h2>

    </div>

  </div>


  <div class="filter-section">

    <label>
      {{ 'FILTER.CATEGORY' | translate }}
    </label>

    <mat-form-field
      appearance="outline"
      class="filter-select"
    >

      <mat-select
        [(ngModel)]="tempCategoryId"
        panelClass="product-filter-select-panel"
      >

        <!-- DEFAULT -->
        <mat-option value="all">
          {{ 'FILTER.All_Categories' | translate }}
        </mat-option>


        <!-- CATEGORIES -->
        <mat-option
          *ngFor="let category of categories"
          [value]="category.id"
        >
          {{ getCategoryName(category) }}
        </mat-option>

      </mat-select>

    </mat-form-field>

  </div>


  <label class="offer-filter">

    <input
      type="checkbox"
      [(ngModel)]="tempOffers"
    />

    <span>
      {{ 'FILTER.OFFERS' | translate }}
    </span>

  </label>


  <div class="filter-actions">

    <button
      type="button"
      class="clear-button"
      (click)="clearFilters()"
    >

      <mat-icon>
        close
      </mat-icon>

      {{ 'COMMON.CLEAR' | translate }}

    </button>


    <button
      type="button"
      class="apply-button"
      (click)="applyFilters()"
    >

      <mat-icon>
        filter_alt
      </mat-icon>

      {{ 'COMMON.APPLY' | translate }}

    </button>

  </div>

</div>
