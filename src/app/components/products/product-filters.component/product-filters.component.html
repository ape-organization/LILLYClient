<div class="product-filters">


  <!-- ====================================================
       MOBILE HEADER
       ==================================================== -->

  <div class="mobile-filter-header">

    <div class="mobile-filter-title">

      <mat-icon>
        filter_alt
      </mat-icon>

      <h2>
        {{ 'COMMON.FILTER' | translate }}
      </h2>

    </div>

  </div>


 


  <!-- ====================================================
       CATEGORY
       ==================================================== -->

  <div class="filter-section">

    <label>
      {{ 'FILTER.CATEGORY' | translate }}
    </label>

    <select
      [(ngModel)]="tempCategoryId"
      (ngModelChange)="onCategoryChange()"
    >

      <option [ngValue]="null">
        {{ 'FILTER.All_Categories' | translate }}
      </option>

      <option
        *ngFor="let category of categories"
        [ngValue]="category.id"
      >

        {{ getCategoryName(category) }}

      </option>

    </select>

  </div>



  <!-- ====================================================
       OFFERS
       ==================================================== -->

  <label class="offer-filter">

    <input
      type="checkbox"
      [(ngModel)]="tempOffers"
    />

    <span>
      {{ 'FILTER.OFFERS' | translate }}
    </span>

  </label>


  <!-- ====================================================
       ACTIONS
       ==================================================== -->

  <div class="filter-actions">

    <button
      type="button"
      class="clear-button"
      (click)="clearFilters()"
    >

      <mat-icon>
        close
      </mat-icon>

      {{ 'COMMON.CLEAR' | translate }}

    </button>


    <button
      type="button"
      class="apply-button"
      (click)="applyFilters()"
    >

      <mat-icon>
        filter_alt
      </mat-icon>

      {{ 'COMMON.APPLY' | translate }}

    </button>

  </div>

</div>
